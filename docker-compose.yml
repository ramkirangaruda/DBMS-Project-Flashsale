services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flashsale
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flashsale"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 2s

  # ---------------------------------------------------------------------
  # Observability. Appended -- the postgres and redis definitions above are
  # untouched. Both scrape/read only; neither is required for the app to run.
  #
  # The FastAPI app runs on the HOST (python -m app.main), not in a
  # container, so Prometheus reaches it via host.docker.internal. The
  # extra_hosts line makes that resolve on Linux too, where it is not
  # built in the way it is on Docker Desktop.
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=6h"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      # Anonymous admin: this is a local demo dashboard with no secrets in
      # it, and a login wall would only get in the way of showing it on a
      # projector or screenshotting it. Do not copy this to anything real.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: "dark"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------------
  # Distributed tracing. Appended -- everything above is untouched.
  #
  # all-in-one bundles the collector, query service and UI in one container
  # with in-memory storage. Traces are LOST ON RESTART, which is the right
  # trade for a demo (no volume, no retention policy, no migration) but means
  # a screenshot is the durable artefact, not the container.
  #
  # OTLP is the only ingest path used here; the app talks to :4318 over HTTP
  # rather than gRPC, which keeps grpcio off the requirements list.
  # ---------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"   # web UI
      - "4318:4318"     # OTLP/HTTP  <- app/tracing.py exports here
      - "4317:4317"     # OTLP/gRPC  (unused, exposed for convenience)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Bounds memory on a long chaos run: N=600 across three strategies
      # produces tens of thousands of spans and the default is unlimited.
      MEMORY_MAX_TRACES: "50000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------
  # Horizontally scaled API tier. Appended -- postgres and redis above are
  # untouched, and DELIBERATELY still single instances. This phase scales
  # the stateless layer only; the whole question being tested is what
  # happens to a contended row lock when you put three times as many
  # processes in front of one database.
  #
  # Three explicit services rather than `deploy: replicas: 3` because
  # Compose (non-Swarm) will not publish distinct ports for replicas, and
  # Prometheus has to scrape each instance separately -- scraping counters
  # through a load balancer would hand you a different process each time
  # and produce nonsense.
  #
  # NOTE ON ADMISSION: app/queue.py runs its admission worker per process,
  # so three replicas run three of them and the effective admission rate is
  # 3 x QUEUE_ADMIT_BATCH per interval. That is left as-is on purpose --
  # it is the honest out-of-the-box behaviour of scaling this design, and
  # results/horizontal_scaling_notes.md reports it as a finding rather than
  # quietly working around it.
  # ---------------------------------------------------------------------
  api1: &api
    build: .
    image: flashsale-api:latest
    # Each replica also published directly, on 8011/8012/8013. Traffic for
    # the experiments goes through nginx on 8080; these exist so /metrics can
    # be read per process. Counters are per-process, so scraping them through
    # the load balancer would sample a random replica each time.
    ports:
      - "8011:8010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &api_env
      # Inside the compose network these are the container ports, not the
      # remapped published ones the host process uses.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: flashsale-engine
      HOST: 0.0.0.0
      PORT: 8010
      # Swept by the experiments; see results/horizontal_scaling_notes.md.
      QUEUE_ADMIT_BATCH: ${QUEUE_ADMIT_BATCH:-10}
      ADMISSION_ENFORCED: ${ADMISSION_ENFORCED:-true}
      # Passed through from the HOST's environment if set, empty otherwise --
      # app/payments.py already handles an empty key by returning a clear
      # 503 (see STRIPE_KEY_HELP), so leaving these unset here is safe and
      # does not need its own default. Without this line the payment step
      # was previously only reachable against the single host process
      # (`python -m app.main`), never through the scaled deployment.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8010/api')\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api2:
    <<: *api
    ports:
      - "8012:8010"
    environment:
      <<: *api_env

  api3:
    <<: *api
    ports:
      - "8013:8010"
    environment:
      <<: *api_env

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    depends_on:
      - api1
      - api2
      - api3
    volumes:
      - ./monitoring/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      # Hits nginx's own /nginx-health location (see monitoring/nginx.conf),
      # which returns 200 without touching any backend. NOT /api: that
      # proxies to whichever replica least_conn picks, so a healthcheck
      # against it answers "is a backend up" rather than "is nginx up".
      # Backend health is already covered independently by api1/2/3's own
      # healthchecks above.
      #
      # 127.0.0.1, NOT "localhost" -- this is the actual, confirmed root
      # cause of nginx showing unhealthy for 33+ hours in the scaling
      # phase while genuinely serving every real request correctly.
      # /etc/hosts in nginx:1.27-alpine resolves "localhost" to ::1
      # before 127.0.0.1, busybox wget tries that address and gets it,
      # and nginx's `listen 80;` only binds IPv4 (confirmed via
      # `netstat -tln` inside the container: 0.0.0.0:80 only, no :::80)
      # -- so every healthcheck attempt failed with a genuine connection
      # refused, verified directly: `wget http://localhost/...` fails,
      # `wget http://127.0.0.1/...` succeeds, in the same container, back
      # to back. Not a missing binary (wget is present) and not the
      # upstream conflation fixed above -- a real IPv6/IPv4 mismatch.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  promdata:
  grafanadata:
