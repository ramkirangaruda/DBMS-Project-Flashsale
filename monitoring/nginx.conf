# Load balancer in front of the three API replicas.
#
# No sticky sessions, deliberately: every piece of per-buyer state -- queue
# position, admission token, idempotency record, Redis stock -- already lives
# in Redis, not in a process. A buyer can join the queue on api1, poll status
# on api3 and check out on api2 with no coordination at all. If any of that
# had been kept in process memory this whole phase would not work, and
# needing sticky routing would have been the signal.

worker_processes auto;

events {
    # Default is 512, which this load would hit immediately: a single N=1000
    # run has ~1000 buyers holding connections open while they poll.
    worker_connections 8192;
}

http {
    access_log off;                 # keeps nginx from becoming the bottleneck
    sendfile on;
    tcp_nodelay on;

    upstream flashsale_api {
        # least_conn, not round-robin. Checkout latency under contention
        # varies by orders of magnitude (sub-50ms sold-out rejections vs
        # multi-second lock waits), so distributing by connection count keeps
        # a replica stuck behind a slow lock from being handed more work.
        least_conn;
        server api1:8010 max_fails=0;
        server api2:8010 max_fails=0;
        server api3:8010 max_fails=0;
        keepalive 256;
    }

    server {
        listen 80;

        # Generous, because the point of the experiment is to measure how
        # slow the app gets under load. A default 60s proxy timeout would
        # turn the interesting tail into nginx-generated 504s and quietly
        # replace the measurement with an artefact of the proxy.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Dedicated healthcheck target that never touches the upstream.
        #
        # The original healthcheck hit /api, which proxy_pass's straight
        # through to whichever replica least_conn picks -- so "is nginx
        # healthy" and "did a backend answer in time" were the same
        # question. That is the wrong signal for a load balancer's own
        # health: one replica running slow under load (exactly the
        # condition these experiments create on purpose) could fail the
        # healthcheck and mark nginx itself unhealthy, even though nginx
        # was doing its job correctly the whole time. Confirmed nginx
        # itself was never the problem -- `wget` (what the healthcheck
        # uses) is present in nginx:1.27-alpine, so the failure mode was
        # never a missing binary, only this conflation.
        #
        # Backend health is already covered independently by api1/api2/
        # api3's own healthchecks in docker-compose.yml.
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://flashsale_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # W3C trace context must survive the hop or the Jaeger traces
            # from the previous phase stop stitching together.
            proxy_pass_request_headers on;
        }
    }
}
