# Prometheus scrape config for the flash-sale engine.
#
# A chaos run lasts seconds, not minutes, so the scrape interval is short --
# at the 15s default an entire N=200 burst would land inside a single sample
# and the retry spike this exists to show would be invisible.
global:
  scrape_interval: 2s
  evaluation_interval: 5s
  external_labels:
    project: flashsale-engine

scrape_configs:
  # Horizontally scaled API tier. Each replica is scraped SEPARATELY and on
  # purpose: these are per-process counters, so pulling them through the
  # nginx load balancer would land on an arbitrary replica each interval and
  # produce a series that jumps between three unrelated counter values.
  # Scrape each, then sum in the query.
  - job_name: flashsale-api-replicas
    metrics_path: /metrics
    static_configs:
      - targets: ["api1:8010", "api2:8010", "api3:8010"]

  - job_name: flashsale-api
    metrics_path: /metrics
    static_configs:
      # The API runs on the host, not in a container.
      # Override with PROM_API_TARGET if you move it.
      - targets: ["host.docker.internal:8010"]
        labels:
          service: flashsale-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
